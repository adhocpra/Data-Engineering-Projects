# dbt project: finance transactions, staging -> intermediate -> marts.
# Adapter: DuckDB (local, no server). Raw data is loaded into the
# raw_transactions table by scripts/load_raw.py (the Airflow DAG's first task).
name: finance_dbt
version: 1.0.0
config-version: 2

profile: finance_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  finance_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
